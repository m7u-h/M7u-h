name: Build M7uh2link APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      
      - name: Clean Project
        run: flutter clean
      
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Generate Android Files
        run: flutter create . --platforms=android

      # البحث عن أي ملف gradle (سواء .gradle أو .gradle.kts) وتعديله لرفع compileSdk إلى 36
      - name: Fix compileSdk Version Automatically
        run: |
          echo "Searching for Gradle build files..."
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 36/g; s/compileSdkVersion 34/compileSdkVersion 36/g; s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g; s/compileSdk = 34/compileSdk = 36/g' {} +

      # تغيير اسم التطبيق أوتوماتيكياً
      - name: Fix App Name
        run: sed -i 's/android:label=".*"/android:label="M7uh2link"/g' android/app/src/main/AndroidManifest.xml
        
      - name: Generate App Icon from Code
        run: flutter test lib/generate_icon.dart
        
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        
      - name: Build Release APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M7uh2link-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
