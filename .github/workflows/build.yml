name: Build M7uh2link APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'latest'
          cache: true
      
      - name: Clean Project
        run: flutter clean
      
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Generate Android Files
        run: flutter create . --platforms=android

      # الحل الجذري: فحص الصيغتين وتعديلهما لرفع compileSdk و targetSdk إلى 36
      - name: Force SDK Versions
        run: |
          echo "Updating Gradle config..."
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = 34/targetSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' android/app/build.gradle
          fi
          echo "Gradle files updated successfully."

      - name: Fix App Name
        run: sed -i 's/android:label=".*"/android:label="M7uh2link"/g' android/app/src/main/AndroidManifest.xml
        
      - name: Generate App Icon from Code
        run: flutter test lib/generate_icon.dart
        
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        
      - name: Build Release APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M7uh2link-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
