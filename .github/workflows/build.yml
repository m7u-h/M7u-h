name: Build M7uh2link APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # 1. تثبيت Java 17 (مطلوب لبناء التطبيقات)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true
      
      # 2. تنظيف المشروع من أي ملفات بناء قديمة
      - name: Clean Project
        run: flutter clean
      
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Generate Missing Android Files
        run: flutter create . --platforms=android
        
      - name: Generate App Icon from Code
        run: flutter test lib/generate_icon.dart
        
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        
      - name: Build Release APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M7uh2link-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
