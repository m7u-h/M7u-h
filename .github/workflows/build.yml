name: Build M7uh2link APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7' # <--- حدّثنا النسخة هنا
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Generate App Icon from Code
        run: flutter test lib/generate_icon.dart
        
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        
      - name: Build Release APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M7uh2link-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
