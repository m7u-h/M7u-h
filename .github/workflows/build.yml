name: Build M7uh2link APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # 2. تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      # 3. تثبيت المكتبات
      - name: Install Dependencies
        run: flutter pub get
        
      # 4. رسم الأيقونة بالكود (بدون أي صورة)
      - name: Generate App Icon from Code
        run: flutter test lib/generate_icon.dart
        
      # 5. تطبيق الأيقونة على الأندرويد
      - name: Apply Launcher Icons
        run: dart run flutter_launcher_icons
        
      # 6. بناء ملف APK النهائي
      - name: Build Release APK
        run: flutter build apk --release
        
      # 7. رفع ملف APK كـ Artifact للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M7uh2link-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
