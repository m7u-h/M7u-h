name: Build M7uh2link APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
          
      # 1. ننشئ مجلد أندرويد بدون ما نمسح ملف pubspec.yaml مالتنا
      - name: Generate Android files
        run: flutter create --platforms=android --project-name m7uh2link .
        
      # 2. ننزل المكتبات
      - name: Get dependencies
        run: flutter pub get

      # 3. تأمين مكتبة الأيقونات غصباً (عشان نمنع أي خطأ)
      - name: Ensure Launcher Icons Package
        run: flutter pub add flutter_launcher_icons --dev
        
      - name: Fix SDK Version
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/g' android/app/build.gradle
          fi
          
      - name: Fix App Name
        run: sed -i 's/android:label=".*"/android:label="M7uh2link"/g' android/app/src/main/AndroidManifest.xml
        
      - name: Generate Icon
        run: flutter test lib/generate_icon.dart
        
      - name: Apply Icons
        run: dart run flutter_launcher_icons
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M7uh2link-APK
          path: build/app/outputs/flutter-apk/app-release.apk
