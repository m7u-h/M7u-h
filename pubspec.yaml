name: m7uh2link
description: "M7uh2link - ئەپی گۆڕینی فایل بۆ لینکی ڕاستەوخۆ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0' # <--- هذا السطر هو السر لحل المشكلة

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  media_link_generator: ^1.0.0 # <--- حدّثناها لأحدث نسخة
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
